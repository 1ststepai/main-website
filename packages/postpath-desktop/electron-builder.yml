appId: ai.1ststep.postpath
productName: PostPath
executableName: PostPath
copyright: Copyright 1stStep.ai
asar: true
npmRebuild: false
directories:
  output: dist
files:
  - electron/**
  - package.json
extraResources:
  - from: ../social-mcp
    to: social-mcp
    filter:
      - package.json
      - bin/**
      - src/**
      - node_modules/**
      - "!**/.env"
      - "!**/.env.*"
      - "!**/*.pem"
      - "!**/*.key"
      - "!**/test/**"
      - "!**/oauth.env"
win:
  target:
    - dir
  # Unsigned unless the build script sees CSC_LINK and CSC_KEY_PASSWORD.
  # Do not commit a certificate. electron-builder signs the app exe only
  # when scripts/build-windows-installer.sh turns signAndEditExecutable on.
  signingHashAlgorithms:
    - sha256
  signAndEditExecutable: false
  verifyUpdateCodeSignature: false
