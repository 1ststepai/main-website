<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="PostPath">
  <title>PostPath</title>
  <defs>
    <linearGradient id="ppRibbon" x1="18" y1="8" x2="118" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="28%" stop-color="#3b82f6"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="78%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#ff8a4c"/>
    </linearGradient>
    <linearGradient id="ppRibbonEdge" x1="20" y1="10" x2="90" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#c4b5fd" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fda4af" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="ppGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Folded ribbon P stem + bowl -->
  <g filter="url(#ppGlow)">
    <path
      d="M34 18
         C34 18 34 108 34 108
         C34 114 40 118 46 114
         L58 106
         C62 103 62 97 58 93
         L46 84
         C42 81 40 78 40 74
         L40 58
         C40 52 44 48 50 48
         L68 48
         C90 48 104 34 104 18
         C104 4 88 -2 68 2
         L46 8
         C38 10 34 14 34 18 Z"
      fill="url(#ppRibbon)"
    />
    <!-- Inner cut for bowl / glass layer -->
    <path
      d="M52 20
         C52 20 70 16 78 16
         C90 16 96 22 96 28
         C96 36 88 42 74 42
         L52 42 Z"
      fill="#0b1020"
      opacity="0.55"
    />
    <!-- Highlight ribbon edge -->
    <path
      d="M40 22 C42 14 58 10 74 12 C92 14 100 24 98 34"
      fill="none"
      stroke="url(#ppRibbonEdge)"
      stroke-width="3.5"
      stroke-linecap="round"
      opacity="0.9"
    />
    <!-- Play triangle in the P bowl -->
    <path d="M62 24 L78 33 L62 42 Z" fill="#f8fafc"/>
  </g>
</svg>
